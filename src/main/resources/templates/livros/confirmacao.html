<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Livro Cadastrado</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>

<header>
    <h1>Sistema de Biblioteca</h1>
</header>

<main>
    <h2>Livro cadastrado!</h2>

    <p><strong>Título:</strong> <span th:text="${livro.titulo}"></span></p>
    <p><strong>Autor:</strong> <span th:text="${livro.autor}"></span></p>
    <p><strong>ISBN:</strong> <span th:text="${livro.isbn}"></span></p>

    <p><a th:href="@{/livros/novo}">Cadastrar outro livro</a></p>
    <p><a th:href="@{/livros}">Voltar ao início</a></p>
</main>

</body>
</html>
