<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalhes do Livro</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>

<header>
    <h1>Sistema de Biblioteca</h1>
</header>

<main>
    <h2>Detalhes do Livro</h2>
    <p><strong>Título:</strong> <span th:text="${livro.titulo}">Título</span></p>
    <p><strong>Autor:</strong> <span th:text="${livro.autor}">Autor</span></p>
    <p><strong>ISBN:</strong> <span th:text="${livro.isbn}">ISBN</span></p>
    <p><a th:href="@{/livros}">Voltar ao início</a></p>
</main>

</body>
</html>
