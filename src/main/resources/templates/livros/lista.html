<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Livros</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<header>
    <h1>Sistema de Biblioteca</h1>
</header>
<main>
    <h2>Livros cadastrados</h2>
    <p><a th:href="@{/livros/novo}">Cadastrar novo livro</a></p>
    <table>
        <thead>
        <tr>
            <th>Título</th>
            <th>Autor</th>
            <th>ISBN</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="livro, status : ${livros}">
            <td th:text="${livro.titulo}"></td>
            <td th:text="${livro.autor}"></td>
            <td th:text="${livro.isbn}"></td>
            <td>
                <a th:href="@{/livros/excluir/{in[dice}(indice=${status.index})}">Excluir</a>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
