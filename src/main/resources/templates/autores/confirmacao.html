<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Autor Cadastrado</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>

<header>
    <h1>Sistema de Biblioteca</h1>
</header>

<main>
    <h2>Autor cadastrado!</h2>

    <p><strong>Nome:</strong> <span th:text="${autor.nome}"></span></p>
    <p><strong>Nacionalidade:</strong> <span th:text="${autor.nacionalidade}"></span></p>

    <p><a th:href="@{/autores/novo}">Cadastrar outro autor</a></p>
    <p><a th:href="@{/livros}">Voltar ao início</a></p>
</main>

</body>
</html>
